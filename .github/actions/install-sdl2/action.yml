# Shared by every Ubuntu job in build.yml.

name: Install SDL2
description: Install the SDL2 development packages the Linux builds link against.

runs:
  using: composite
  steps:
    - name: apt-get libsdl2-dev libsdl2-net-dev
      shell: bash
      env:
        # Suppress package-manager prompts on headless runners.
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
        NEEDRESTART_SUSPEND: 1
      run: |
        set -eu

        # Bound each apt call; a stalled regional mirror has no reliable timeout.
        apt_get()
        {
          timeout -k 10 "$1" sudo -E apt-get -y "${apt_opts[@]}" "${@:2}" < /dev/null
        }

        apt_opts=(-o DPkg::Lock::Timeout=90
                  -o Acquire::Retries=3
                  -o Acquire::http::Timeout=20
                  -o Acquire::https::Timeout=20)

        for attempt in 1 2 3; do
          if apt_get 150 update && apt_get 150 install libsdl2-dev libsdl2-net-dev; then
            exit 0
          fi
          echo "apt attempt $attempt did not finish"

          # Repair a transaction interrupted by the timeout.
          timeout -k 10 60 sudo -E dpkg --configure -a || true

          # After the first failure, bypass the regional mirrorlist over IPv4.
          if [ "$attempt" -eq 1 ]; then
            # Everything except amd64 and i386 is served from ports.ubuntu.com.
            case "$(dpkg --print-architecture)" in
              amd64 | i386) archive=https://archive.ubuntu.com/ubuntu/ ;;
              *) archive=https://ports.ubuntu.com/ubuntu-ports/ ;;
            esac
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
                     /etc/apt/sources.list.d/*.list; do
              test -f "$f" || continue
              sudo sed -i -e "s|mirror+file:/etc/apt/apt-mirrors\.txt|$archive|g" \
                          -e "s|http://azure\.archive\.ubuntu\.com/ubuntu/|$archive|g" \
                          -e "s|http://azure\.ports\.ubuntu\.com/ubuntu-ports/|$archive|g" "$f"
            done
            apt_opts+=(-o Acquire::ForceIPv4=true)
            echo "retrying from $archive over IPv4"
          fi

          sleep 5
        done

        echo 'SDL2 packages could not be installed'
        exit 1
