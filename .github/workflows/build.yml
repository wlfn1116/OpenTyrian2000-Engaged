# Builds every release target. Master refreshes `latest`; tags publish the same artifacts.
# The data job supplies one stripped freeware-data package to all platform jobs.

name: build

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Game data
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Restore cached tyrian2000.zip
        id: cache
        uses: actions/cache@v5
        with:
          path: tyrian2000.zip
          key: tyrian2000-zip-v1

      - name: Download freeware Tyrian 2000 data
        if: steps.cache.outputs.cache-hit != 'true'
        run: curl -fL --retry 3 -o tyrian2000.zip https://www.camanis.net/tyrian/tyrian2000.zip

      - name: Extract and strip desktop-only files
        run: |
          unzip -q -j tyrian2000.zip 'tyrian2000/*' -d data
          rm -f data/*.exe data/*.dll data/*.pif data/*.ico data/*.box \
                data/*.ovl data/*.cfg data/*.sav data/*.txt data/*.sf2
          # Validate the files required at startup.
          for f in tyrian1.lvl tyrian.hdt music.mus palette.dat; do
            test -f "data/$f" || { echo "missing $f in data zip"; exit 1; }
          done

      - uses: actions/upload-artifact@v6
        with:
          name: tyrian2000-data
          path: data
          retention-days: 1

  # Replay hashes must match on x86-64 and ARM64.
  tests:
    name: Correctness suite ${{ matrix.label }}
    needs: data
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: x86-64
          - runner: ubuntu-24.04-arm
            label: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install SDL2
        uses: ./.github/actions/install-sdl2
        timeout-minutes: 15

      - uses: actions/download-artifact@v7
        with:
          name: tyrian2000-data
          path: test-data

      - name: Build testable game
        run: make -j"$(nproc)"

      - name: Unit, migration, replay, and network tests
        run: make test TEST_DATA=test-data

  sanitizers:
    name: ASan + UBSan
    needs: data
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install SDL2
        uses: ./.github/actions/install-sdl2
        timeout-minutes: 15

      - uses: actions/download-artifact@v7
        with:
          name: tyrian2000-data
          path: test-data

      - name: Build and run sanitizer suite
        run: make -j"$(nproc)" sanitize-test TEST_DATA=test-data

  windows:
    name: Windows x86-64
    needs: data
    timeout-minutes: 45
    # windows-latest provides the v145 toolset used by the project files.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: microsoft/setup-msbuild@v3

      - name: Build (Release x64)
        run: |
          $commit = $env:GITHUB_SHA.Substring(0, 7)
          msbuild visualc\opentyrian.sln /m /v:minimal /t:Build `
            /p:Configuration=Release /p:Platform=x64 `
            "/p:SDL2BaseDir=${{ github.workspace }}\stuff\SDL2-2.26.2" `
            "/p:SDL2netBaseDir=${{ github.workspace }}\stuff\SDL2_net-2.2.0" `
            "/p:OPENTYRIAN_COMMIT=$commit"

      - uses: actions/download-artifact@v7
        with:
          name: tyrian2000-data
          path: pkg/data

      - name: Correctness suite (Windows)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python testing\run_unit_suite.py `
            --exe .\opentyrian-x64-Release.exe --data pkg\data
          python testing\run_replay_fixtures.py `
            --exe .\opentyrian-x64-Release.exe --data pkg\data
          python testing\network_fault_test.py `
            --exe .\opentyrian-x64-Release.exe --data pkg\data --base-port 46100

      - name: Package 7z
        run: |
          Copy-Item opentyrian-x64-Release.exe pkg\OpenTyrian2000-Engaged-Windows-x86_64.exe
          Copy-Item SDL2.dll, SDL2_net.dll, libfluidsynth-3.dll pkg\
          7z a -mx=9 OpenTyrian2000-Engaged-Windows-x86_64.7z .\pkg\*

      # Run the packaged game headless for 15 seconds; an early exit fails the job.
      - name: Smoke test (headless)
        run: |
          $env:SDL_VIDEODRIVER = 'dummy'
          $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process -FilePath .\pkg\OpenTyrian2000-Engaged-Windows-x86_64.exe -WorkingDirectory .\pkg -PassThru
          if ($p.WaitForExit(15000)) { throw "game exited early (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'survived 15s headless'

      # Avoid recompressing the 7z inside GitHub's artifact wrapper.
      - uses: actions/upload-artifact@v6
        with:
          name: OpenTyrian2000-Engaged-Windows-x86_64
          path: OpenTyrian2000-Engaged-Windows-x86_64.7z
          compression-level: 0

      # Keep symbols separately for crash-log decoding.
      - uses: actions/upload-artifact@v6
        with:
          name: OpenTyrian2000-Engaged-Windows-x86_64-pdb
          path: opentyrian-x64-Release.pdb

  windows-arm:
    name: Windows ARM64
    needs: data
    timeout-minutes: 60
    # This ARM64 image carries the v145 toolset. MIDI remains x64-only.
    runs-on: windows-11-vs2026-arm
    env:
      SDL2_VERSION: 2.30.11
      SDL2_NET_VERSION: 2.2.0
    steps:
      - uses: actions/checkout@v5

      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: arm64

      # Build ARM64 SDL SDKs in the layout expected by sdl_paths.props.
      - name: Restore the cached ARM64 SDL SDKs
        id: sdl-cache
        uses: actions/cache@v5
        with:
          path: visualc/sdk
          key: windows-arm64-sdl-${{ env.SDL2_VERSION }}-${{ env.SDL2_NET_VERSION }}

      - name: Build SDL2 and SDL2_net for ARM64
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          # Fail this step immediately when a native command fails.
          $PSNativeCommandUseErrorActionPreference = $true

          New-Item -ItemType Directory -Force -Path visualc\external\SDL2, visualc\external\SDL2_net | Out-Null
          curl.exe -fL --retry 3 -o sdl2.tar.gz `
            "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL2_VERSION/SDL2-$env:SDL2_VERSION.tar.gz"
          curl.exe -fL --retry 3 -o sdl2net.tar.gz `
            "https://github.com/libsdl-org/SDL_net/releases/download/release-$env:SDL2_NET_VERSION/SDL2_net-$env:SDL2_NET_VERSION.tar.gz"
          tar -xzf sdl2.tar.gz --strip-components=1 -C visualc\external\SDL2
          tar -xzf sdl2net.tar.gz --strip-components=1 -C visualc\external\SDL2_net

          # CMake 4 needs the policy floor; PowerShell needs that argument quoted.
          # SDL_LIBC keeps ARM64 SDL linked to the CRT used by the game. See doc/notes.md.
          cmake -S visualc\external\SDL2 -B visualc\external\SDL2\build -A ARM64 `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            -DSDL_LIBC=ON -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build visualc\external\SDL2\build --config Release --parallel
          # CMake resolves a relative install prefix against its script directory.
          cmake --install visualc\external\SDL2\build --config Release `
            --prefix "$pwd\visualc\external\SDL2-install"

          cmake -S visualc\external\SDL2_net -B visualc\external\SDL2_net\build -A ARM64 `
            "-DCMAKE_PREFIX_PATH=$pwd\visualc\external\SDL2-install" -DSDL2NET_SAMPLES=OFF
          cmake --build visualc\external\SDL2_net\build --config Release --parallel
          cmake --install visualc\external\SDL2_net\build --config Release `
            --prefix "$pwd\visualc\external\SDL2_net-install"

          # Restage CMake's output into the VC package layout.
          foreach ($name in 'SDL2', 'SDL2_net') {
            New-Item -ItemType Directory -Force -Path "visualc\sdk\$name\include", "visualc\sdk\$name\lib\arm64" | Out-Null
            Copy-Item "visualc\external\$name-install\include\SDL2\*" "visualc\sdk\$name\include\"
            Copy-Item "visualc\external\$name-install\lib\*.lib" "visualc\sdk\$name\lib\arm64\"
            Copy-Item "visualc\external\$name-install\bin\*.dll" "visualc\sdk\$name\lib\arm64\"
          }

      # Validate both fresh and cached SDKs before linking.
      - name: Check the staged SDKs
        run: |
          foreach ($f in 'visualc\sdk\SDL2\include\SDL.h', 'visualc\sdk\SDL2\lib\arm64\SDL2.lib',
                         'visualc\sdk\SDL2\lib\arm64\SDL2main.lib', 'visualc\sdk\SDL2\lib\arm64\SDL2.dll',
                         'visualc\sdk\SDL2_net\include\SDL_net.h', 'visualc\sdk\SDL2_net\lib\arm64\SDL2_net.lib',
                         'visualc\sdk\SDL2_net\lib\arm64\SDL2_net.dll') {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }

      - name: Build (Release ARM64)
        run: |
          $commit = $env:GITHUB_SHA.Substring(0, 7)
          msbuild visualc\opentyrian.sln /m /v:minimal /t:Build `
            /p:Configuration=Release /p:Platform=ARM64 `
            "/p:SDL2BaseDir=${{ github.workspace }}\visualc\sdk\SDL2" `
            "/p:SDL2netBaseDir=${{ github.workspace }}\visualc\sdk\SDL2_net" `
            "/p:OPENTYRIAN_COMMIT=$commit"

      # Read the PE machine field; an accidental x64 build would also run on this host.
      - name: Check the executable is ARM64
        run: |
          $bytes = [System.IO.File]::ReadAllBytes('opentyrian-ARM64-Release.exe')
          $machine = [System.BitConverter]::ToUInt16($bytes, [System.BitConverter]::ToInt32($bytes, 0x3C) + 4)
          if ($machine -ne 0xAA64) { throw ('machine 0x{0:X4}, expected 0xAA64' -f $machine) }

      - uses: actions/download-artifact@v7
        with:
          name: tyrian2000-data
          path: pkg/data

      - name: Correctness suite (Windows ARM64)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python testing\run_unit_suite.py `
            --exe .\opentyrian-ARM64-Release.exe --data pkg\data
          python testing\run_replay_fixtures.py `
            --exe .\opentyrian-ARM64-Release.exe --data pkg\data
          python testing\network_fault_test.py `
            --exe .\opentyrian-ARM64-Release.exe --data pkg\data --base-port 46200

      - name: Package 7z
        run: |
          Copy-Item opentyrian-ARM64-Release.exe pkg\OpenTyrian2000-Engaged-Windows-arm64.exe
          Copy-Item visualc\sdk\SDL2\lib\arm64\SDL2.dll, visualc\sdk\SDL2_net\lib\arm64\SDL2_net.dll pkg\
          7z a -mx=9 OpenTyrian2000-Engaged-Windows-arm64.7z .\pkg\*

      # Run the packaged game headless for 15 seconds; an early exit fails the job.
      - name: Smoke test (headless)
        run: |
          $env:SDL_VIDEODRIVER = 'dummy'
          $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process -FilePath .\pkg\OpenTyrian2000-Engaged-Windows-arm64.exe -WorkingDirectory .\pkg -PassThru
          if ($p.WaitForExit(15000)) { throw "game exited early (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'survived 15s headless'

      # Avoid recompressing the 7z inside GitHub's artifact wrapper.
      - uses: actions/upload-artifact@v6
        with:
          name: OpenTyrian2000-Engaged-Windows-arm64
          path: OpenTyrian2000-Engaged-Windows-arm64.7z
          compression-level: 0

      # Keep symbols separately for crash-log decoding.
      - uses: actions/upload-artifact@v6
        with:
          name: OpenTyrian2000-Engaged-Windows-arm64-pdb
          path: opentyrian-ARM64-Release.pdb

  linux:
    name: Linux ${{ matrix.label }}
    needs: data
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # `arch` names the package, `label` names the job; they differ only in the separator
      # that the released x86_64 file names have always used.
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            label: x86-64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            label: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install SDL2
        uses: ./.github/actions/install-sdl2
        timeout-minutes: 15

      - name: Build
        run: make -j"$(nproc)"

      # Package the binary beside data/ for in-place use.
      - uses: actions/download-artifact@v7
        with:
          name: tyrian2000-data
          path: stage/opentyrian2000/data

      - name: Package tar.gz
        run: |
          cp opentyrian2000 stage/opentyrian2000/
          tar -C stage -czf OpenTyrian2000-Engaged-Linux-${{ matrix.arch }}.tar.gz opentyrian2000

      # Exit 124 means the headless game survived the 15-second timeout.
      - name: Smoke test (headless)
        working-directory: stage/opentyrian2000
        run: |
          status=0
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy timeout 15s ./opentyrian2000 || status=$?
          test "$status" -eq 124 || { echo "game exited early (status $status)"; exit 1; }
          echo 'survived 15s headless'

      # The tar layer preserves the executable bit; avoid recompressing it.
      - uses: actions/upload-artifact@v6
        with:
          name: OpenTyrian2000-Engaged-Linux-${{ matrix.arch }}
          path: OpenTyrian2000-Engaged-Linux-${{ matrix.arch }}.tar.gz
          compression-level: 0

  android:
    name: Android
    needs: data
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      SDL2_VERSION: 2.30.11
      SDL2_NET_VERSION: 2.2.0
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Android builds the pinned SDL sources alongside the game.
      - name: Restore cached SDL sources
        id: sdl-cache
        uses: actions/cache@v5
        with:
          path: |
            android/app/src/main/jni/SDL2
            android/app/src/main/jni/SDL2_net
          key: android-sdl-${{ env.SDL2_VERSION }}-${{ env.SDL2_NET_VERSION }}

      - name: Download SDL sources
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          jni=android/app/src/main/jni
          mkdir -p "$jni/SDL2" "$jni/SDL2_net"
          curl -fL --retry 3 -o sdl2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz"
          curl -fL --retry 3 -o sdl2net.tar.gz \
            "https://github.com/libsdl-org/SDL_net/releases/download/release-$SDL2_NET_VERSION/SDL2_net-$SDL2_NET_VERSION.tar.gz"
          tar -xzf sdl2.tar.gz --strip-components=1 -C "$jni/SDL2"
          tar -xzf sdl2net.tar.gz --strip-components=1 -C "$jni/SDL2_net"

      # setup-gradle rejects SDL's sample wrappers, including copies restored from cache.
      - name: Drop SDL's bundled Gradle wrappers
        run: |
          find android/app/src/main/jni -name 'gradle-wrapper.jar' -print -delete
          find android/app/src/main/jni -name 'gradle-wrapper.properties' -delete

      # Check committed icon output before aapt2 renames it.
      - name: Check the committed launcher icons
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_foreground; do
              p="android/app/src/main/res/mipmap-$d/$f.png"
              test -s "$p" || { echo "missing $p; re-run tools/make_app_icons.ps1"; exit 1; }
            done
          done

      - name: Install the pinned NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$ANDROID_NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: actions/download-artifact@v7
        with:
          name: tyrian2000-data
          path: android/app/src/main/assets/data

      # Build the manifest used to unpack archived APK assets. Keep it out of its own listing.
      - name: Index the packaged data
        working-directory: android/app/src/main/assets/data
        run: |
          ls -1 > ../filelist.tmp
          mv ../filelist.tmp filelist.txt
          test -s filelist.txt

      # Keep the debug signature stable so sideloaded builds upgrade in place.
      - name: Cache the debug signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # v6 runs on Node 24; v4 is pinned to the deprecated Node 20.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.12'

      - name: Build APK
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease \
            -PopentyrianCommit="$(printf %.7s "$GITHUB_SHA")"
          cp app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/OpenTyrian2000-Engaged-Android.apk"

      # The runner cannot launch the APK, so verify its ABIs and packaged data.
      - name: Verify APK contents
        run: |
          list=$(unzip -Z1 OpenTyrian2000-Engaged-Android.apk)
          for want in lib/arm64-v8a/libmain.so lib/armeabi-v7a/libmain.so \
                      lib/arm64-v8a/libSDL2.so lib/arm64-v8a/libSDL2_net.so \
                      assets/data/tyrian1.lvl assets/data/filelist.txt; do
            printf '%s\n' "$list" | grep -qx "$want" || { echo "missing $want"; exit 1; }
          done
          # aapt2 renames icons; their committed inputs were checked before the build.

      # Already a compressed archive; skip GitHub's wrapper compression.
      - uses: actions/upload-artifact@v6
        with:
          name: OpenTyrian2000-Engaged-Android
          path: OpenTyrian2000-Engaged-Android.apk
          compression-level: 0

  ios:
    name: iOS
    needs: data
    timeout-minutes: 45
    runs-on: macos-latest
    env:
      SDL2_VERSION: 2.30.11
      SDL2_NET_VERSION: 2.2.0
    steps:
      - uses: actions/checkout@v5

      # ios/CMakeLists.txt globs data/ at configure time, so the files have to land first.
      - uses: actions/download-artifact@v7
        with:
          name: tyrian2000-data
          path: data

      - name: Restore cached SDL sources
        id: sdl-cache
        uses: actions/cache@v5
        with:
          path: |
            ios/external/SDL2
            ios/external/SDL2_net
          key: ios-sdl-${{ env.SDL2_VERSION }}-${{ env.SDL2_NET_VERSION }}

      - name: Download SDL sources
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ios/external/SDL2 ios/external/SDL2_net
          curl -fL --retry 3 -o sdl2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz"
          curl -fL --retry 3 -o sdl2net.tar.gz \
            "https://github.com/libsdl-org/SDL_net/releases/download/release-$SDL2_NET_VERSION/SDL2_net-$SDL2_NET_VERSION.tar.gz"
          tar -xzf sdl2.tar.gz --strip-components=1 -C ios/external/SDL2
          tar -xzf sdl2net.tar.gz --strip-components=1 -C ios/external/SDL2_net

      # Ninja avoids a separate xcodebuild for every SDL probe. Build one unsigned device slice.
      - name: Configure
        run: |
          command -v ninja > /dev/null || brew install ninja
          cmake -S ios -B ios/build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENTYRIAN_COMMIT="$(printf %.7s "$GITHUB_SHA")"

      - name: Build
        run: cmake --build ios/build --parallel

      - name: Package unsigned IPA
        run: |
          app=ios/build/OpenTyrian2000.app
          test -x "$app/OpenTyrian2000" || { echo "no app binary at $app"; exit 1; }
          test -f "$app/data/tyrian1.lvl" || { echo "game data missing from the bundle"; exit 1; }
          test -f "$app/Assets.car" || { echo "icon asset catalog missing from the bundle"; exit 1; }
          # Verify that actool's icon keys reached the bundle plist.
          echo "--- actool partial plist ---"
          cat ios/build/actool-partial.plist || true
          echo "--- bundle Info.plist ---"
          plutil -p "$app/Info.plist"
          plutil -p "$app/Info.plist" | grep -q CFBundleIconName ||
            { echo "Info.plist has no CFBundleIconName"; exit 1; }
          plutil -p "$app/Info.plist" | grep -q CFBundlePrimaryIcon ||
            { echo "actool's icon keys were not merged into Info.plist"; exit 1; }
          rm -rf Payload
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry OpenTyrian2000-Engaged-iOS.ipa Payload

      # Already a compressed archive; skip GitHub's wrapper compression.
      - uses: actions/upload-artifact@v6
        with:
          name: OpenTyrian2000-Engaged-iOS
          path: OpenTyrian2000-Engaged-iOS.ipa
          compression-level: 0

  macos:
    name: macOS universal
    needs: data
    timeout-minutes: 60
    runs-on: macos-latest
    env:
      SDL2_VERSION: 2.30.11
      SDL2_NET_VERSION: 2.2.0
    steps:
      - uses: actions/checkout@v5

      # macos/CMakeLists.txt globs data/ at configure time, so the files have to land first.
      - uses: actions/download-artifact@v7
        with:
          name: tyrian2000-data
          path: data

      - name: Restore cached SDL sources
        id: sdl-cache
        uses: actions/cache@v5
        with:
          path: |
            macos/external/SDL2
            macos/external/SDL2_net
          key: macos-sdl-${{ env.SDL2_VERSION }}-${{ env.SDL2_NET_VERSION }}

      - name: Download SDL sources
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p macos/external/SDL2 macos/external/SDL2_net
          curl -fL --retry 3 -o sdl2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz"
          curl -fL --retry 3 -o sdl2net.tar.gz \
            "https://github.com/libsdl-org/SDL_net/releases/download/release-$SDL2_NET_VERSION/SDL2_net-$SDL2_NET_VERSION.tar.gz"
          tar -xzf sdl2.tar.gz --strip-components=1 -C macos/external/SDL2
          tar -xzf sdl2net.tar.gz --strip-components=1 -C macos/external/SDL2_net

      # CMakeLists.txt owns the universal architectures and deployment target.
      - name: Configure
        run: |
          command -v ninja > /dev/null || brew install ninja
          cmake -S macos -B macos/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENTYRIAN_COMMIT="$(printf %.7s "$GITHUB_SHA")"

      - name: Build
        run: cmake --build macos/build --parallel

      # Post-build copies invalidate the ad-hoc signature. Re-sign, then use ditto to preserve
      # bundle metadata. This does not notarize the app; see macos/README.md.
      - name: Sign and package
        run: |
          app=macos/build/OpenTyrian2000.app
          bin="$app/Contents/MacOS/OpenTyrian2000"
          test -x "$bin" || { echo "no app binary at $app"; exit 1; }
          test -f "$app/Contents/Resources/data/tyrian1.lvl" || { echo "game data missing from the bundle"; exit 1; }
          test -f "$app/Contents/Resources/tyrian2000.icns" || { echo "icon missing from the bundle"; exit 1; }
          archs=$(lipo -archs "$bin")
          for want in arm64 x86_64; do
            printf '%s\n' "$archs" | grep -qw "$want" || { echo "no $want slice (got: $archs)"; exit 1; }
          done
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          ditto -c -k --keepParent "$app" OpenTyrian2000-Engaged-macOS-universal.zip

      # Already a compressed archive; skip GitHub's wrapper compression.
      - uses: actions/upload-artifact@v6
        with:
          name: OpenTyrian2000-Engaged-macOS
          path: OpenTyrian2000-Engaged-macOS-universal.zip
          compression-level: 0

  switch:
    name: Nintendo Switch
    needs: data
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v5

      - name: Bake game data into romfs
        uses: actions/download-artifact@v7
        with:
          name: tyrian2000-data
          path: switch/romfs

      - name: Build .nro
        run: |
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          # The container uses sh, so avoid Bash substring expansion.
          export OPENTYRIAN_COMMIT="$(printf %.7s "$GITHUB_SHA")"
          make -C switch -j"$(nproc)"
          cp switch/opentyrian2000.nro OpenTyrian2000-Engaged-Switch.nro

      - uses: actions/upload-artifact@v6
        with:
          name: OpenTyrian2000-Engaged-Switch
          path: OpenTyrian2000-Engaged-Switch.nro

  vita:
    name: PlayStation Vita
    needs: data
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: tyrian2000-data
          path: data

      - name: Build eboot.bin
        run: |
          cmake -S vita -B vita/build -DOPENTYRIAN_COMMIT="$(printf %.7s "$GITHUB_SHA")"
          cmake --build vita/build -j"$(nproc)"

      # Mirror vita/build.ps1 staging. APP_VER is the zero-padded major.minor
      # from src/opentyrian_version.h, with 01.00 as the invalid-input fallback.
      - name: Assemble VPK
        run: |
          ver=$(sed -n 's/.*OPENTYRIAN_VERSION *"\([^"]*\)".*/\1/p' src/opentyrian_version.h | sed 's/.*[vV]//')
          major=${ver%%.*}; rest=${ver#*.}; minor=${rest%%.*}
          appver=$(printf '%02d.%02d' "$major" "$minor" 2>/dev/null) || appver=01.00
          case "$appver" in [0-9][0-9].[0-9][0-9]) ;; *) appver=01.00 ;; esac
          echo "APP_VER: $appver (from version '$ver')"
          "$VITASDK/bin/vita-mksfoex" -s APP_VER="$appver" -s TITLE_ID=OTYR20000 -s CATEGORY=gd \
            "OpenTyrian 2000 Engaged" vita/build/param.sfo
          stage=vita/build/vpk
          rm -rf "$stage"
          mkdir -p "$stage/sce_sys/livearea/contents" "$stage/data"
          cp vita/build/eboot.bin "$stage/"
          cp vita/build/param.sfo "$stage/sce_sys/"
          cp vita/sce_sys/icon0.png vita/sce_sys/pic0.png "$stage/sce_sys/"
          cp vita/sce_sys/livearea/contents/* "$stage/sce_sys/livearea/contents/"
          cp data/* "$stage/data/"
          cd "$stage" && cmake -E tar cf "$GITHUB_WORKSPACE/OpenTyrian2000-Engaged-Vita.vpk" --format=zip .

      # Avoid recompressing the VPK inside GitHub's artifact wrapper.
      - uses: actions/upload-artifact@v6
        with:
          name: OpenTyrian2000-Engaged-Vita
          path: OpenTyrian2000-Engaged-Vita.vpk
          compression-level: 0

  # Refresh the rolling `latest` pre-release after every master build.
  prerelease:
    name: Update latest pre-release
    if: github.ref == 'refs/heads/master'
    needs: [windows, windows-arm, linux, macos, android, ios, switch, vita, tests, sanitizers]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: OpenTyrian2000-Engaged-*
          merge-multiple: true

      - name: Create or update the `latest` pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(OpenTyrian2000-Engaged-Windows-x86_64.7z
                  OpenTyrian2000-Engaged-Windows-arm64.7z
                  OpenTyrian2000-Engaged-Linux-x86_64.tar.gz
                  OpenTyrian2000-Engaged-Linux-aarch64.tar.gz
                  OpenTyrian2000-Engaged-macOS-universal.zip
                  OpenTyrian2000-Engaged-Android.apk
                  OpenTyrian2000-Engaged-iOS.ipa
                  OpenTyrian2000-Engaged-Switch.nro
                  OpenTyrian2000-Engaged-Vita.vpk)
          subject=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
                    --jq '.commit.message' | head -n 1)
          notes="Automatic build of ${GITHUB_SHA:0:9} (${subject}), $(date -u +'%Y-%m-%d %H:%M UTC')."
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2> /dev/null || true
          gh release create latest "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" --title "Latest build" --notes "$notes"

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, windows-arm, linux, macos, android, ios, switch, vita, tests, sanitizers]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: OpenTyrian2000-Engaged-*
          merge-multiple: true

      # Attach to an existing release, or create a draft for release notes.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(OpenTyrian2000-Engaged-Windows-x86_64.7z
                  OpenTyrian2000-Engaged-Windows-arm64.7z
                  OpenTyrian2000-Engaged-Linux-x86_64.tar.gz
                  OpenTyrian2000-Engaged-Linux-aarch64.tar.gz
                  OpenTyrian2000-Engaged-macOS-universal.zip
                  OpenTyrian2000-Engaged-Android.apk
                  OpenTyrian2000-Engaged-iOS.ipa
                  OpenTyrian2000-Engaged-Switch.nro
                  OpenTyrian2000-Engaged-Vita.vpk)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
