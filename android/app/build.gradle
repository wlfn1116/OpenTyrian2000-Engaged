plugins {
	id 'com.android.application'
}

// Read the version from the header shared by the game and other packages.
def engagedVersion() {
	def header = file('../../src/opentyrian_version.h').text
	def match = header =~ /OPENTYRIAN_VERSION\s+"[^"0-9]*([0-9]+(?:\.[0-9]+)*)"/
	return match ? match[0][1] : '1.0'
}

// Pack the dotted version into Android's monotonically increasing integer versionCode.
def engagedVersionCode(String version) {
	def parts = version.tokenize('.').collect { it.toInteger() }
	while (parts.size() < 3) parts << 0
	return parts[0] * 10000 + parts[1] * 100 + parts[2]
}

android {
	namespace 'net.opentyrian.engaged'
	compileSdk 35
	ndkVersion '27.2.12479018'

	defaultConfig {
		applicationId 'net.opentyrian.engaged'
		minSdk 26
		targetSdk 35
		versionName engagedVersion()
		versionCode engagedVersionCode(engagedVersion())

		externalNativeBuild {
			ndkBuild {
				// The short commit id lands on the title screen, matching every other target.
				arguments "OPENTYRIAN_COMMIT=${project.findProperty('opentyrianCommit') ?: ''}"
				abiFilters 'arm64-v8a', 'armeabi-v7a'
			}
		}
	}

	externalNativeBuild {
		ndkBuild {
			path 'src/main/jni/Android.mk'
		}
	}

	sourceSets {
		// Include SDL's Java backend; the local activity only supplies platform policy.
		main.java.srcDirs += 'src/main/jni/SDL2/android-project/app/src/main/java'
	}

	buildTypes {
		release {
			minifyEnabled false
			// CI caches this debug key so sideloaded builds upgrade in place.
			signingConfig signingConfigs.debug
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
}
